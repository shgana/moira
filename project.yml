name: Moira
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Moira:
    type: application
    platform: iOS
    sources:
      - path: Moira/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shgana.moira
        PRODUCT_NAME: Moira
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moira
        INFOPLIST_KEY_MOIRA_PROXY_BASE_URL: ""
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Moira uses your location only when you choose nearby restaurant search or directions.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  MoiraTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Moira
    sources:
      - path: Moira/Tests
    dependencies:
      - target: Moira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shgana.moira.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Moira:
    build:
      targets:
        Moira: all
        MoiraTests: [test]
    test:
      targets:
        - name: MoiraTests
